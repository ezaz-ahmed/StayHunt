services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '5000:5000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stayhunt
      POSTGRES_PASSWORD: stayhunt
      POSTGRES_DB: stayhunt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stayhunt -d stayhunt']
      retries: 5
      interval: 5s
      timeout: 5s

volumes:
  postgres-data:
